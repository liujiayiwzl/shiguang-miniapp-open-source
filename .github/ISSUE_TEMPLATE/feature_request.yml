name: "✨ 功能建议"
description: "分享可以改进拾光的想法"
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
      placeholder: "使用时遇到了什么不便？"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的解决方案
      placeholder: "希望新增哪些功能或改善哪些交互？"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案（可选）
