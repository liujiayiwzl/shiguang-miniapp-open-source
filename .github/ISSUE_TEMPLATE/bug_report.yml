name: "🐛 Bug 反馈"
description: "报告可以复现的问题（请勿提交密钥或个人信息）"
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 简单说明发生了什么
      placeholder: "例如：在单词学习页切换至四选一后无法显示题目"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按照操作顺序说明
      placeholder: "1. 打开...\n2. 点击...\n3. 出现..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果 / 实际结果
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境信息
      placeholder: "微信开发者工具版本 / 手机系统 / 微信基础库版本"
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我已移除截图和日志中的密钥、OpenID、手机号等敏感数据
          required: true
